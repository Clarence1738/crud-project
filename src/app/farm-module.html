<section class="module-page"><header class="module-head"><div><p class="eyebrow">FARM OPERATIONS</p><h1>{{config.title}}</h1><p>{{config.description}}</p></div><div class="module-actions"><label>Active farm<select [ngModel]="farm()?.id||''" (ngModelChange)="selectFarm($event)">@for(item of farms();track item.id){<option [value]="item.id">{{item.name}}</option>}</select></label><button class="primary" (click)="showForm()" [disabled]="!farm()">+ Add {{config.singular}}</button></div></header>@if(error()){<p class="error">{{error()}}</p>}<section class="grid-card"><dx-data-grid [dataSource]="records()" keyExpr="id" [rowAlternationEnabled]="true" [columnAutoWidth]="true" [filterRow]="{visible:true}" [headerFilter]="{visible:true}" [showBorders]="false">@for(column of config.columns;track column.key){<dxi-data-grid-column [dataField]="column.key" [caption]="column.label"/>}<dxi-data-grid-column caption="Actions" cellTemplate="actionsCell" [allowFiltering]="false" [allowSorting]="false"/><div *dxTemplate="let cell of 'actionsCell'"><button class="edit-action" type="button" (click)="edit(cell.data)">Edit</button></div></dx-data-grid></section></section>
@if(open()){<div class="module-backdrop" (click)="open.set(false)"><section class="module-modal" (click)="$event.stopPropagation()"><header><h2>{{editingId() ? 'Edit' : 'Add'}} {{config.singular}}</h2><button (click)="open.set(false)">&times;</button></header><form (ngSubmit)="save()">@for(field of config.fields;track field.key){<label [class.wide]="field.type==='textarea'">{{field.label}}@if(field.type==='select'){<select [name]="field.key" [ngModel]="draft[field.key]" (ngModelChange)="draft[field.key]=$event" [required]="!!field.required">@for(option of field.options;track option){<option [value]="option">{{option}}</option>}</select>}@else if(field.type==='textarea'){<textarea [name]="field.key" [ngModel]="draft[field.key]" (ngModelChange)="draft[field.key]=$event" rows="3"></textarea>}@else{<input [type]="field.type||'text'" [name]="field.key" [ngModel]="draft[field.key]" (ngModelChange)="draft[field.key]=$event" [required]="!!field.required" [min]="field.type==='number'?0:null">}</label>}<button class="primary" [disabled]="busy()">Save {{config.singular}}</button></form></section></div>}
