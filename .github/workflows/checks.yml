name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  laravel:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shipment_tests
          POSTGRES_USER: shipment_tests
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipment_tests -d shipment_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: shipment_tests
      DB_USERNAME: shipment_tests
      DB_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, fileinfo
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: PostgreSQL integration tests
        run: php vendor/bin/phpunit
      - name: SQLite tests
        run: php vendor/bin/phpunit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
